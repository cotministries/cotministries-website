<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Messages</title><meta name="robots" content="noindex">
<script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
<style>
:root{--bg:#f5f5f7;--card:#fff;--text:#1d1d1f;--muted:#6e6e73;--line:#e2e2e7;--accent:#3a63e8}
@media (prefers-color-scheme:dark){:root{--bg:#141416;--card:#1f1f23;--text:#f2f2f4;--muted:#a0a0a8;--line:#33333a;--accent:#7f9bff}}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--text)}
header{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 20px;background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0}
header h1{font-size:1.1rem;margin:0}a{color:var(--accent)}
.wrap{max-width:860px;margin:0 auto;padding:20px 16px}
.msg{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px 18px;margin-bottom:12px}
.top{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}.who{font-weight:700}.meta{color:var(--muted);font-size:.85rem}
.body{white-space:pre-wrap;margin:10px 0 12px;line-height:1.5}
.actions{display:flex;gap:8px}.actions a,.actions button,header button{font:inherit;font-size:.85rem;padding:7px 14px;border-radius:8px;border:1px solid var(--line);background:transparent;color:var(--text);cursor:pointer;text-decoration:none}
.actions a{background:var(--accent);border-color:var(--accent);color:#fff}.empty,.err{text-align:center;color:var(--muted);padding:40px 10px}.err{color:#d33}
</style></head><body>
<header><h1>📬 Messages</h1><div><a href="/admin/">← Back to editor</a> <button id="refresh">Refresh</button></div></header>
<div class="wrap" id="list"><p class="empty">Loading…</p></div>
<script>
const list = document.getElementById('list');
const esc = (s) => String(s || '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
async function api(method, q) {
  const user = netlifyIdentity.currentUser();
  if (!user) { netlifyIdentity.open('login'); throw new Error('Please log in.'); }
  const token = await user.jwt();
  const r = await fetch('/.netlify/functions/messages' + (q || ''), { method, headers: { Authorization: 'Bearer ' + token } });
  const data = await r.json();
  if (!r.ok) throw new Error(data.error || 'Error ' + r.status);
  return data;
}
async function load() {
  list.innerHTML = '<p class="empty">Loading…</p>';
  try {
    const msgs = await api('GET');
    if (!msgs.length) { list.innerHTML = '<p class="empty">No messages yet.</p>'; return; }
    list.innerHTML = msgs.map((m) => `<div class="msg"><div class="top"><span class="who">${esc(m.name || 'No name')} <span class="meta">&lt;${esc(m.email)}&gt;</span></span><span class="meta">${new Date(m.date).toLocaleString()} · ${esc(m.form)}</span></div>
      <div class="body">${esc(m.message)}</div><div class="actions"><a href="mailto:${esc(m.email)}?subject=${encodeURIComponent('Re: your message')}">Reply</a><button data-id="${esc(m.id)}">Delete</button></div></div>`).join('');
  } catch (e) { list.innerHTML = `<p class="err">${esc(e.message)}</p>`; }
}
list.addEventListener('click', async (e) => {
  const id = e.target.dataset && e.target.dataset.id;
  if (!id) return;
  e.target.textContent = 'Deleting…'; e.target.disabled = true;
  try { await api('DELETE', '?id=' + encodeURIComponent(id)); load(); } catch (err) { e.target.textContent = 'Failed'; }
});
document.getElementById('refresh').onclick = load;
netlifyIdentity.on('init', (u) => u ? load() : netlifyIdentity.open('login'));
netlifyIdentity.on('login', () => { netlifyIdentity.close(); load(); });
netlifyIdentity.init();
</script></body></html>
