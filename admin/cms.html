<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Advanced editor</title><meta name="robots" content="noindex">
<script src="/admin/repo-files.js"></script>
<script src="/admin/site-settings.js"></script>
<script src="/admin/render.js"></script>
<script>
  window.CMS_MANUAL_INIT = true;
  // Logged in with the email code (Cloudflare Access): open the editor straight away, no extra login button.
  try { if (!localStorage.getItem('decap-cms-user')) localStorage.setItem('decap-cms-user', JSON.stringify({ backendName: 'github', token: 'cf-access' })); } catch (e) {}
  // GitHub login token (saved by the editor after login) – also unlocks Messages and "Put website live".
  window.editorToken = function () { try { var u = JSON.parse(localStorage.getItem('decap-cms-user') || 'null'); return u && u.token; } catch (e) { return null; } };
</script>
</head><body>
<script src="https://unpkg.com/decap-cms@^3.8.0/dist/decap-cms.js"></script>
<script>
  // The live preview uses the exact same renderer as the real site.
  let siteSettings = window.siteSettings || {}, siteData = window.siteData || {};
  CMS.registerPreviewStyle('/styles.css');
  function resolveAssets(v, getAsset) {
    if (Array.isArray(v)) return v.map((x) => resolveAssets(x, getAsset));
    if (v && typeof v === 'object') { const o = {}; for (const k in v) o[k] = resolveAssets(v[k], getAsset); return o; }
    if (typeof v === 'string' && v.startsWith('/uploads/')) { try { const a = getAsset(v); return a ? a.toString() : v; } catch (e) { return v; } }
    return v;
  }
  const head = (t, sections) => `<link rel="stylesheet" href="${SiteRender.fontsHref(t, sections)}"><style>${SiteRender.themeCss(t)}</style>${SiteRender.SYMBOLS}`;
  const view = (html, sections) => h('div', { dangerouslySetInnerHTML: { __html: head(siteSettings.theme, sections) + html } });
  CMS.registerPreviewTemplate('pages', createClass({
    render() { const d = resolveAssets(this.props.entry.get('data').toJS(), this.props.getAsset); return view(SiteRender.renderSections(d.sections, siteSettings, siteData), d.sections); }
  }));
  const shopPreview = (key, sections) => createClass({
    render() {
      const d = resolveAssets(this.props.entry.get('data').toJS(), this.props.getAsset);
      const items = Array.isArray(d.items) ? d.items : [];
      const data = Object.assign({}, siteData, { [key]: key === 'services' ? d : (items.length || key !== 'packages' ? items : (siteData.packages || [])) });
      if (key === 'packages') data.packages = (data.packages || []).map((p) => Object.assign({}, p, { show: true }));
      if (key === 'events') (data.events || []).forEach((e) => { if (e.show === false) e.show = true; });
      return view((key === 'events' ? '<p style="padding:12px 20px;font:14px system-ui;background:#fff3cd">Preview shows hidden events too.</p>' : '') + SiteRender.renderSections(sections, siteSettings, data));
    }
  });
  CMS.registerPreviewTemplate('books', shopPreview('books', [{ type: 'bookShop' }]));
  CMS.registerPreviewTemplate('events', shopPreview('events', [{ type: 'events', style: 'red', emptyText: 'No events to show.' }]));
  CMS.registerPreviewTemplate('services', shopPreview('services', [{ type: 'serviceMenu', heading: 'Service Menu' }]));
  CMS.registerPreviewTemplate('packages', shopPreview('packages', [{ type: 'packages', heading: 'Bridal Packages', sub: 'For the bride and her party' }]));
  CMS.registerPreviewTemplate('testimonies', createClass({
    render() { const d = resolveAssets(this.props.entry.get('data').toJS(), this.props.getAsset); return view(SiteRender.renderSections([{ type: 'testimonies', heading: 'Testimonies' }], siteSettings, Object.assign({}, siteData, { testimonies: (d.items || []).map((t) => Object.assign({}, t, { show: true })) }))); }
  }));
  CMS.registerPreviewTemplate('settings', createClass({
    render() {
      const s = resolveAssets(this.props.entry.get('data').toJS(), this.props.getAsset); siteSettings = s;
      const html = SiteRender.renderPage({ title: 'Preview', slug: 'preview', sections: [{ type: 'text', heading: 'Colors & fonts preview', sub: 'Small line', body: 'Body text looks like this. **Bold** and [a link](#).', align: 'center', buttons: [{ label: 'Main button', url: '#' }] }, { type: 'contact', script: 'Reach out', formTitle: 'Send a message', topics: ['Example'] }] }, s, siteData)
        .replace(/^[\s\S]*?<body[^>]*>/, '').replace(/<script[\s\S]*$/, '');
      return h('div', { dangerouslySetInnerHTML: { __html: head(s.theme) + html } });
    }
  }));
  // Log in with GitHub on this same domain (functions/api/auth.js)
  // Saving goes through this website (/api/github), so editors who log in with the email code need no GitHub account.
  CMS.init({ config: { backend: { base_url: location.origin, api_root: location.origin + '/api/github' } } });
</script>
<script>
  // Unread badge: checks for new messages every minute (read status is remembered per device).
  document.addEventListener('DOMContentLoaded', function () {
    var btn = document.getElementById('inbox-btn'), badge = document.getElementById('inbox-badge');
    var accent = (window.siteSettings && siteSettings.theme && siteSettings.theme.primary) || '#d4a437';
    async function check() {
      try {
        var t = editorToken();
        if (!t) return;
        var r = await fetch('/api/messages', { headers: { Authorization: 'Bearer ' + t } });
        if (!r.ok) return;
        var seen = new Set(JSON.parse(localStorage.getItem('inbox-seen') || '[]'));
        var n = (await r.json()).filter(function (m) { return !seen.has(m.id); }).length;
        badge.textContent = n > 99 ? '99+' : n;
        badge.style.display = n ? 'inline-flex' : 'none';
        btn.style.borderColor = n ? accent : 'transparent';
        btn.title = n ? n + ' new message' + (n > 1 ? 's' : '') : 'No new messages';
      } catch (e) {}
    }
    setTimeout(check, 2500); setInterval(check, 60000);
    document.addEventListener('visibilitychange', function () { if (document.visibilityState === 'visible') check(); });
  });
</script>
<!-- Put website live: saves only store changes; this publishes everything saved in one deploy -->
<style>
  /* Editor tools dock: bottom right, out of the way of Decap's menus on the left */
  #dock{position:fixed;right:16px;bottom:16px;z-index:9999;display:flex;flex-wrap:wrap-reverse;justify-content:flex-end;gap:8px;max-width:calc(100vw - 32px);font:14px system-ui,sans-serif}
  #dock .dk{display:flex;align-items:center;gap:8px;background:#16161a;color:#fff;padding:11px 18px;border-radius:999px;font:600 14px system-ui,sans-serif;text-decoration:none;border:2px solid transparent;box-shadow:0 6px 20px rgba(0,0,0,.28);cursor:pointer;transition:.2s;white-space:nowrap}
  #dock .dk:hover{transform:translateY(-1px);background:#26262c}
  #dock .bdg{display:none;min-width:22px;height:22px;padding:0 6px;border-radius:999px;background:#e5484d;color:#fff;font-size:12px;font-weight:800;align-items:center;justify-content:center}
  #live-wrap{position:relative}
  @media (max-width:640px){#dock .dk{padding:10px 14px;font-size:13px}#dock .lbl{display:none}}
  #live-btn .n{display:none;min-width:22px;height:22px;padding:0 6px;border-radius:999px;background:#e5a50a;color:#16161a;font-size:12px;font-weight:800;align-items:center;justify-content:center}
  #live-pop{display:none;position:absolute;right:0;bottom:56px;width:min(340px,calc(100vw - 32px));background:#fff;color:#1c1c1f;border-radius:14px;box-shadow:0 14px 40px rgba(0,0,0,.3);padding:18px}
  #live-pop.on{display:block}
  #live-pop h4{margin:0 0 4px;font-size:16px}
  #live-pop .muted{color:#6b6b73;font-size:13px;margin:0 0 12px}
  #live-pop ul{margin:0 0 14px;padding:0;list-style:none;max-height:180px;overflow:auto;border-top:1px solid #eee}
  #live-pop li{padding:7px 0;border-bottom:1px solid #eee;font-size:13px;display:flex;justify-content:space-between;gap:10px}
  #live-pop li span{color:#8a8a92;white-space:nowrap}
  #live-go{width:100%;padding:12px;border:0;border-radius:10px;background:#0f2a5e;color:#fff;font:700 14px system-ui,sans-serif;cursor:pointer}
  #live-go:disabled{opacity:.5;cursor:default}
  #live-msg{margin:10px 0 0;font-size:13px}
</style>
<div id="dock">
<a class="dk" href="/admin/" title="Back to the studio home">🏠 <span class="lbl">Studio</span></a>
<a class="dk" href="/admin/schedule.html" id="sched-btn" title="Opening hours, days off and booked times">🗓 <span class="lbl">Schedule</span></a>
<a class="dk" href="/admin/blog.html" title="Write and manage blog posts">✍️ <span class="lbl">Blog</span></a>
<a class="dk" href="/admin/newsletter.html" title="Newsletter sign-ups and letters">💌 <span class="lbl">Newsletter</span></a>
<a class="dk" href="/admin/messages.html" id="inbox-btn">📬 <span class="lbl">Messages</span><span class="bdg" id="inbox-badge"></span></a>
<div id="live-wrap">
  <div id="live-pop" role="dialog" aria-label="Put website live">
    <h4>🚀 Put website live</h4>
    <p class="muted" id="live-when">Checking…</p>
    <ul id="live-list"></ul>
    <button id="live-go" type="button">Put website live now</button>
    <p id="live-msg"></p>
  </div>
  <button class="dk" id="live-btn" type="button">🚀 <span class="lbl">Put website live</span><span class="n" id="live-n"></span></button>
</div>
</div>
<script>
  (function () {
    var btn = document.getElementById('live-btn'), pop = document.getElementById('live-pop'), n = document.getElementById('live-n');
    var when = document.getElementById('live-when'), list = document.getElementById('live-list'), go = document.getElementById('live-go'), msg = document.getElementById('live-msg');
    var accent = '#e5a50a', lastLive = null, poll = null;
    var ago = function (t) { if (!t) return 'never'; var m = Math.round((Date.now() - new Date(t)) / 60000); if (m < 1) return 'just now'; if (m < 60) return m + ' min ago'; var h = Math.round(m / 60); if (h < 24) return h + ' hr ago'; return new Date(t).toLocaleDateString(undefined, { month: 'short', day: 'numeric' }) + ', ' + new Date(t).toLocaleTimeString(undefined, { hour: 'numeric', minute: '2-digit' }); };
    var esc = function (x) { return String(x).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); };
    async function api(method) {
      var t = editorToken();
      if (!t) throw new Error('Please log in first.');
      var r = await fetch('/api/go-live', { method: method || 'GET', headers: { Authorization: 'Bearer ' + t } });
      var d = await r.json().catch(function () { return {}; });
      if (!r.ok) throw new Error(d.error || ('Error ' + r.status));
      return d;
    }
    async function refresh() {
      try {
        var d = await api();
        var k = d.waiting.length;
        n.textContent = k; n.style.display = k ? 'inline-flex' : 'none';
        btn.style.borderColor = k ? accent : 'transparent';
        btn.title = k ? k + ' saved change' + (k > 1 ? 's' : '') + ' not live yet' : 'Everything is live';
        if (d.building) {
          when.textContent = 'Going live right now… (usually 1–2 minutes)';
        } else {
          when.textContent = 'Last went live: ' + ago(d.liveAt) + (k ? ' · ' + k + ' saved change' + (k > 1 ? 's' : '') + ' waiting' : ' · everything is live ✓');
        }
        list.innerHTML = d.waiting.map(function (w) { return '<li>' + esc(w.title) + '<span>' + ago(w.at) + '</span></li>'; }).join('');
        list.style.display = k ? '' : 'none';
        go.disabled = !!d.building;
        go.textContent = d.building ? 'Publishing…' : (k ? 'Put ' + k + ' change' + (k > 1 ? 's' : '') + ' live now' : 'Republish website');
        if (d.failed) msg.innerHTML = '⚠️ The last publish failed: ' + esc(d.failed);
        if (poll && !d.building && lastLive && d.liveAt !== lastLive) { msg.textContent = '✅ Done! Your changes are live.'; clearInterval(poll); poll = null; }
        if (!poll) lastLive = d.liveAt;
      } catch (e) { when.textContent = e.message; }
    }
    btn.addEventListener('click', function () { pop.classList.toggle('on'); if (pop.classList.contains('on')) { msg.textContent = ''; refresh(); } });
    document.addEventListener('click', function (e) { if (!e.target.closest('#live-wrap')) pop.classList.remove('on'); });
    go.addEventListener('click', async function () {
      go.disabled = true; go.textContent = 'Starting…'; msg.textContent = '';
      try {
        await api('POST');
        msg.textContent = 'Publishing… this takes 1–2 minutes. You can keep working.';
        if (poll) clearInterval(poll);
        poll = setInterval(refresh, 10000); setTimeout(refresh, 4000);
      } catch (e) { msg.textContent = '⚠️ ' + e.message; go.disabled = false; go.textContent = 'Try again'; }
    });
    setTimeout(refresh, 3000); setInterval(function () { if (!poll) refresh(); }, 120000);
  })();

  // Decap's "Publish" only saves now, so call it "Save".
  (function () {
    var map = { 'Publish': 'Save', 'Publish now': 'Save', 'Publish and create new': 'Save and create new', 'Publish and duplicate': 'Save and duplicate', 'Publishing...': 'Saving…', 'Publishing…': 'Saving…', 'Published': 'Saved', 'Entry published': 'Saved' };
    function swap(root) {
      var w = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, null), t;
      while ((t = w.nextNode())) { var v = t.nodeValue.trim(); if (map[v] && !(t.parentNode && t.parentNode.closest && t.parentNode.closest('#dock'))) t.nodeValue = t.nodeValue.replace(v, map[v]); }
    }
    new MutationObserver(function (ms) { ms.forEach(function (m) { m.addedNodes.forEach(function (x) { if (x.nodeType === 1) swap(x); else if (x.nodeType === 3 && x.parentNode) swap(x.parentNode); }); if (m.type === 'characterData' && m.target.parentNode) swap(m.target.parentNode); }); })
      .observe(document.body, { childList: true, subtree: true, characterData: true });
  })();
</script>
</body></html>
