     "name": "slug",
     "widget": "string",
     "hint": "Lowercase words with dashes, e.g. about-us → yoursite.com/about-us/. The home page must be \"index\". Add new pages to the menu in Site settings.",
     "pattern": [
      "^[a-z0-9-]+$",
      "Only lowercase letters, numbers and dashes"
     ]
    },
    {
     "label": "Google description",
     "name": "description",
     "widget": "string",
     "required": false
