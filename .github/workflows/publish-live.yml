# Commits whose message contains [live] publish the website. Other commits (and "Save" in /admin) only save.
# Needs a GitHub secret DEPLOY_HOOK_URL (repo → Settings → Secrets and variables → Actions) = the Cloudflare deploy hook URL.
name: Publish when commit says [live]
on:
  push:
    branches: [main]
jobs:
  publish:
    if: contains(github.event.head_commit.message, '[live]')
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Cloudflare Pages deploy
        run: curl -fsS -X POST "${{ secrets.DEPLOY_HOOK_URL }}"
